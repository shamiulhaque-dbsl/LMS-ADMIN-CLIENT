  <line x1="214" y1="155" x2="250" y2="195" stroke="#FFB890" stroke-width="0.8" opacity="0.25"/>
  <line x1="286" y1="155" x2="250" y2="195" stroke="#FFB890" stroke-width="0.8" opacity="0.25"/>

