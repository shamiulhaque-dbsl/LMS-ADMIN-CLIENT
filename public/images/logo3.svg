  <circle cx="250" cy="368" r="36" fill="none" stroke="#FF7A3D" stroke-width="2" opacity="0.2"/>
  <circle cx="250" cy="368" r="28" fill="none" stroke="#FF7A3D" stroke-width="2" opacity="0.35"/>
  <circle cx="250" cy="368" r="20" fill="#FF7A3D"/>
  <circle cx="250" cy="368" r="12" fill="#FFF4ED"/>
