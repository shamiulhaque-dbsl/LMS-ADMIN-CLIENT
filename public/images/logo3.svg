  <line x1="250" y1="108" x2="250" y2="148" stroke="#E85D1F" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="148" x2="250" y2="195" stroke="#FF7A3D" stroke-width="1.2" opacity="0.35"/>
  <line x1="250" y1="195" x2="250" y2="248" stroke="#E85D1F" stroke-width="1.5" opacity="0.4"/>
  <line x1="218" y1="120" x2="214" y2="155" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
  <line x1="214" y1="155" x2="210" y2="198" stroke="#1D9E75" stroke-width="1.2" opacity="0.35"/>
