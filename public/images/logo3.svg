  <circle cx="250" cy="248" r="17" fill="#1D9E75" opacity="0.95"/>
  <circle cx="207" cy="244" r="11" fill="#FFB347" opacity="0.9"/>
  <circle cx="293" cy="244" r="11" fill="#FF7A3D" opacity="0.9"/>

