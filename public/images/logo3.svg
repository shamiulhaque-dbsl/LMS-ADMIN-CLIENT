  </radialGradient>
  <rect width="500" height="500" rx="90" fill="url(#glow2)"/>

  <!-- V jaw left arm -->
  <line x1="105" y1="108" x2="250" y2="358" stroke="#FF7A3D" stroke-width="22" stroke-linecap="round"/>
  <!-- V jaw right arm -->
  <line x1="395" y1="108" x2="250" y2="358" stroke="#FF7A3D" stroke-width="22" stroke-linecap="round"/>
  <!-- jaw inner highlight -->
  <line x1="105" y1="108" x2="250" y2="358" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="395" y1="108" x2="250" y2="358" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

  <!-- top fang nodes -->
  <circle cx="105" cy="108" r="22" fill="#FF7A3D"/>
  <circle cx="105" cy="108" r="14" fill="#FFF4ED"/>
  <circle cx="105" cy="108" r="6" fill="#FF7A3D"/>

  <circle cx="395" cy="108" r="22" fill="#FF7A3D"/>
  <circle cx="395" cy="108" r="14" fill="#FFF4ED"/>
  <circle cx="395" cy="108" r="6" fill="#FF7A3D"/>

