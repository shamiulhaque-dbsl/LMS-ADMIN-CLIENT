  <line x1="290" y1="198" x2="293" y2="244" stroke="#FFB347" stroke-width="1.5" opacity="0.4"/>
  <line x1="218" y1="120" x2="250" y2="148" stroke="#FFB890" stroke-width="0.8" opacity="0.25"/>
