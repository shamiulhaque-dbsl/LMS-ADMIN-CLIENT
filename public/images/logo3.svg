  <!-- wordmark -->
  <text x="250" y="444" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#5C2615" text-anchor="middle" letter-spacing="-1">Skill<tspan fill="#FF7A3D">vora</tspan></text>
  <text x="250" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#FFB890" text-anchor="middle" letter-spacing="3.5">AI EDUCATION &amp; AGENCY</text>

